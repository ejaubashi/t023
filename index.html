<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1eee7">
    <meta name="description" content="Afterglow is a two-screen studio for creating posts and stories with spatial photo effects.">
    <title>Afterglow Studio</title>
    <link rel="icon" href="./assets/mark.svg?v=print" type="image/svg+xml">
    <link rel="preload" href="./assets/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles.css?v=print">
    <script type="module" src="./app.js?v=print"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to studio</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#post-studio" aria-label="Afterglow home"><img width="32" height="32" src="./assets/mark.svg?v=print" alt="">afterglow</a>
        <nav aria-label="Studios">
          <a data-nav="post" href="#post-studio"><span data-icon="layers"></span>Post Studio</a>
          <a data-nav="story" href="#story-studio"><span data-icon="fork"></span>Story Studio</a>
        </nav>
        <div class="toolbar" id="workspace-tools" role="group" aria-label="Project actions"></div>
      </div>
    </header>
    <main id="main" class="shell" tabindex="-1">
      <div id="screen"></div>
      <noscript>Enable JavaScript to use the studio.</noscript>
    </main>
    <div id="status" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
