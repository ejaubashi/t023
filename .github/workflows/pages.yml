name: Publish Afterglow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: afterglow-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Check the repository's Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.pages.outputs.mode == 'workflow'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
